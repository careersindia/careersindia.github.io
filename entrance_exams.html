<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide to 70+ National Entrance Exams in India (2025)</title>
    <meta name="description" content="Your ultimate guide to 70+ national level entrance exams in India. Find detailed information on syllabus, eligibility, exam dates, and selection process for JEE, NEET, CAT, XAT and more.">

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* --- General Body & Font --- */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .hub-container {
            max-width: 1400px;
            margin: 20px auto;
            background-color: transparent; /* Main container is now just for layout */
        }

        .hub-title-box {
            text-align: center;
            padding: 25px;
            background-color: turquoise;
            border-radius: 10px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1), 5px 5px 15px rgba(0,0,0,0.2);
            border: 1px solid #3ca8a8;
            margin-bottom: 30px;
        }

        .hub-title-box h1 {
            margin: 0;
            font-family: Impact, sans-serif;
            font-size: 2.8rem;
            color: black;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }
        
        /* --- Two-Column Layout --- */
        .main-content-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .left-column {
            flex: 1;
            min-width: 300px;
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            height: fit-content; /* Sticks to the top */
        }
        
        .right-column {
            flex: 3;
            min-width: 500px;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* --- Left Column: Search & Autocomplete --- */
        .search-container {
            position: relative;
        }
        #examSearchInput {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #ddd;
            border-radius: 30px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        #examSearchInput:focus {
            border-color: turquoise;
        }
        #autocomplete-list {
            border: 1px solid #ddd;
            border-top: none;
            max-height: 400px;
            overflow-y: auto;
            position: absolute;
            background-color: white;
            width: 100%;
            z-index: 100;
            border-radius: 0 0 10px 10px;
        }
        #autocomplete-list div {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        #autocomplete-list div:hover {
            background-color: #e9e9e9;
        }

        /* --- Right Column: Grid and Content --- */
        .exam-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        .exam-item {
            display: flex;
            align-items: center;
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 15px;
            text-decoration: none;
            color: black;
            font-size: 1rem;
            font-weight: bold;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .exam-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }
        .exam-item .icon {
            font-size: 1.8rem;
            margin-right: 15px;
            width: 30px; /* For alignment */
            text-align: center;
            color: #00CED1;
        }

        /* --- Dynamic Content Area --- */
        #examContent {
            font-family: Arial, sans-serif; /* Ensures consistent font */
            line-height: 1.6;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background-color: turquoise;
            color: black;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        /* --- Responsive Grid Adjustments --- */
        @media (max-width: 1300px) { .exam-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 992px) { .exam-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) {
            .main-content-wrapper { flex-direction: column; }
            .exam-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) { .exam-grid { grid-template-columns: 1fr; } }

        /* Home Button (from your code) */
        .home-button-container { position: fixed; top: 20px; right: 25px; z-index: 1000; }
        .home-button-container a img { width: 50px; height: 50px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .home-button-container a:hover img { transform: scale(1.1); }
    </style>
</head>
<body>

    <div class="hub-container">

        <div class="hub-title-box">
            <h1>NATIONAL LEVEL ENTRANCE TESTS</h1>
        </div>

        <div class="main-content-wrapper">
            <div class="left-column">
                <div class="search-container">

                    <div id="autocomplete-list"></div>
                </div>
            </div>

            <div class="right-column" id="rightColumn">
                <!-- The exam grid or content will be loaded here by JavaScript -->
            </div>
        </div>
    </div>
    
    <!-- Home Button -->
    <div class="home-button-container">
      <a href="/mainnow.html" title="Go to Home">
        <img src="images/home-icon.png" alt="Home">
      </a>
    </div>

    <script>
        // --- DATA: All exam information is stored here ---
        const exams = [
            { name: "AFCAT", href: "afcat.html", icon: "fa-solid fa-plane" },

            { name: "CA INTERMEDIATE", href: "ca_intermediate.html", icon: "fa-solid fa-chart-line" },
            { name: "CAT", href: "cat.html", icon: "fa-solid fa-briefcase" },
            { name: "CDS", href: "cds.html", icon: "fa-solid fa-person-military-rifle" },
            { name: "CEED", href: "ceed.html", icon: "fa-solid fa-palette" },

            { name: "CMA FOUNDATION", href: "cma_foundation.html", icon: "fa-solid fa-landmark" },
            { name: "CMA INTERMEDIATE", href: "cma_intermediate.html", icon: "fa-solid fa-chart-pie" },
            { name: "CMAT", href: "cmat.html", icon: "fa-solid fa-building" },
            { name: "CMI ENTRANCE EXAM", href: "cmi_entrance_exam.html", icon: "fa-solid fa-infinity" },
            { name: "CS", href: "cs_professional.html", icon: "fa-solid fa-user-tie" },

            { name: "CSIR UGC NET", href: "csir_ugc_net.html", icon: "fa-solid fa-flask-vial" },
            { name: "CTET", href: "ctet.html", icon: "fa-solid fa-chalkboard-user" },

            { name: "NDA", href: "nda.html", icon: "fa-solid fa-flag" },
            { name: "NEET PG", href: "neet_pg.html", icon: "fa-solid fa-user-doctor" },

            { name: "NEST", href: "nest.html", icon: "fa-solid fa-atom-simple" },

            { name: "NMAT", href: "nmat.html", icon: "fa-solid fa-building-user" },

            { name: "RRB-ALP", href: "rrb_alp.html", icon: "fa-solid fa-train-subway" },
            { name: "RRB-JE", href: "rrb_je.html", icon: "fa-solid fa-helmet-safety" },
            { name: "RRB NTPC", href: "rrb_ntpc.html", icon: "fa-solid fa-train" },
            { name: "SLAT", href: "slat.html", icon: "fa-solid fa-pen-nib" },
            { name: "SNAP", href: "snap.html", icon: "fa-solid fa-lightbulb" },
            { name: "SRFTI-JET", href: "srfti_jet.html", icon: "fa-solid fa-video" },
            { name: "SRM-JEEE", href: "srm_jeee.html", icon: "fa-solid fa-cogs" },
            { name: "SSB-INTERVIEW", href: "ssb_interview.html", icon: "fa-solid fa-user-shield" },
            { name: "SSC-CGL", href: "ssc_cgl.html", icon: "fa-solid fa-landmark-dome" },
            { name: "SSC-CHSL", href: "ssc_chsl.html", icon: "fa-solid fa-computer" },
            { name: "SSC-MTS", href: "ssc_mts.html", icon: "fa-solid fa-file-alt" },
            { name: "UCEED", href: "uceed.html", icon: "fa-solid fa-pen-ruler" },
            { name: "UGC-NET", href: "ugc_net.html", icon: "fa-solid fa-book-open" },
            { name: "VITEEE", href: "viteee.html", icon: "fa-solid fa-flask" },
            { name: "XAT", href: "xat.html", icon: "fa-solid fa-users" },
            { name: "ESIC", href: "esic_exam.html", icon: "fa-solid fa-hospital" },
            { name: "FMGE", href: "fmge.html", icon: "fa-solid fa-globe" },
            { name: "IAT", href: "iiser_aptitude_test_iat.html", icon: "fa-solid fa-brain" }
         
        ];

        const rightColumn = document.getElementById('rightColumn');
        const searchInput = document.getElementById('examSearchInput');
        const autocompleteList = document.getElementById('autocomplete-list');

        // --- Function to render the main exam grid ---
        function renderExamGrid() {
            let gridHTML = '<div class="exam-grid">';
            exams.forEach(exam => {
                gridHTML += `
                    <a href="${exam.href}" class="exam-item" data-file="${exam.href}">
                        <span class="icon"><i class="${exam.icon}"></i></span>
                        <span class="exam-name">${exam.name}</span>
                    </a>
                `;
            });
            gridHTML += '</div>';
            rightColumn.innerHTML = gridHTML;
        }

        // --- Function to load and display content from an HTML file ---
        async function loadExamContent(fileName) {
            rightColumn.innerHTML = '<p>Loading content...</p>'; // Show loading message
            try {
                const response = await fetch(fileName);
                if (!response.ok) {
                    throw new Error(`Could not load ${fileName}. File not found.`);
                }
                const content = await response.text();
                
                // Add a "Back to All Exams" button and the fetched content
                rightColumn.innerHTML = `
                    <a href="#" class="back-button" onclick="renderExamGrid(); return false;">← Back to All Exams</a>
                    <div id="examContent">${content}</div>
                `;
            } catch (error) {
                console.error('Error fetching content:', error);
                rightColumn.innerHTML = `
                    <a href="#" class="back-button" onclick="renderExamGrid(); return false;">← Back to All Exams</a>
                    <p style="color: red;">Sorry, the content for this exam could not be loaded. Please try again later.</p>
                `;
            }
        }

        // --- Function for search and autocomplete ---
        function filterExams() {
            const filter = searchInput.value.toLowerCase();
            autocompleteList.innerHTML = '';
            
            if (filter.length < 2) {
                return; // Don't show suggestions for less than 2 characters
            }

            const filteredExams = exams.filter(exam => exam.name.toLowerCase().includes(filter));
            
            filteredExams.forEach(exam => {
                const div = document.createElement('div');
                div.innerHTML = exam.name;
                div.addEventListener('click', () => {
                    searchInput.value = exam.name;
                    autocompleteList.innerHTML = '';
                    loadExamContent(exam.href); // Load content directly
                });
                autocompleteList.appendChild(div);
            });
        }
        
        // --- Main Event Listener on page load ---
        document.addEventListener('DOMContentLoaded', () => {
            renderExamGrid(); // Show the grid initially

            // Use event delegation for grid item clicks
            rightColumn.addEventListener('click', function(e) {
                const examLink = e.target.closest('.exam-item');
                if (examLink) {
                    e.preventDefault(); // Stop the link from navigating away
                    const fileName = examLink.dataset.file;
                    loadExamContent(fileName);
                }
            });
        });
        
        // --- Close autocomplete when clicking outside ---
        document.addEventListener('click', function(e) {
            if (e.target !== searchInput) {
                autocompleteList.innerHTML = '';
            }
        });
        
    </script>
