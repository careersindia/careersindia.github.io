    <style>

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background-color: white; color: #333; }

        .details-table { width: 100%; border-collapse: collapse; }
        .details-table td { padding: 12px 5px; border-bottom: 1px solid #f0f0f0; vertical-align: top; text-align: left; }
        .details-table tr:last-child td { border-bottom: none; }
        .details-table td:first-child { font-weight: bold; }
        .details-table ul { margin: 0; padding-left: 20px; }
        .home-button-container { position: fixed; top: 20px; right: 25px; z-index: 1000; }
        .home-button-container a img { width: 50px; height: 50px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .placeholder-text { color: #777; font-size: 1.2em; text-align: center; padding: 50px; }
        .scholarship-title { font-size: 1.5em; }
        /* ... add any other CSS rules you have ... */

<body>

    <div class="title-box">
        SCHOLARSHIPS IN THE USA
    </div>

    <div class="main-container">
        <div class="left-column">
            <h2>Filters</h2>
            
            <div class="filter-group">
                <label>Special Reports:</label>
                <button id="indianScholarshipsBtn">Top Scholarships for Indians</button>
            </div>
            
            <div class="filter-group">
                <label for="level-select">Level of Study:</label>
                <select id="level-select">
                    <option value="all">All Levels</option>
                    <option value="undergraduate">Undergraduate</option>
                    <option value="master">Postgraduate (Master's)</option>
                    <option value="phd">Doctoral (PhD)</option>
                    <option value="postdoctoral">Postdoctoral</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="date-select">University Establishment Date:</label>
                <select id="date-select">
                    <option value="all">Any Time</option>
                    <option value="before-1500">Before 1500</option>
                    <option value="1500-1700">1500 - 1700</option>
                    <option value="1700-1900">1700 - 1900</option>
                    <option value="1900-2000">1900 - 2000</option>
                    <option value="after-2000">After 2000</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Sort Results:</label>
                <button id="sort-by-qs-btn">Sort by QS Ranking</button>
            </div>
        </div>
        <div class="right-column">
            <div id="scholarship-display">
                <div class="placeholder-text">Loading scholarships...</div>
            </div>
        </div>
    </div>

    <div class="home-button-container">
        <a href="/scholarships.html" title="Back to All Countries">

 <script>
