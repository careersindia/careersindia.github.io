<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Internships & Projects</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Add some basic styling for the results */
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 800px; margin: auto; }
        #search-container { margin-bottom: 20px; }
        #search-box { width: 70%; padding: 10px; font-size: 1rem; }
        #search-button { padding: 10px; font-size: 1rem; }
        .project-card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .project-title { font-size: 1.2rem; font-weight: bold; }
        .company-name { color: #555; }
        .apply-link { display: inline-block; margin-top: 10px; padding: 8px 12px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Find Live Internships & Projects in India</h1>
    <div id="search-container">
        <input type="text" id="search-box" placeholder="e.g., 'Web Development Intern' or 'Marketing Project'">
        <button id="search-button">Search</button>
    </div>
    <div id="results-container">
        <p>Loading projects...</p>
    </div>
</div>


    <script>
    const searchInput = document.getElementById('search-box');
    const searchButton = document.getElementById('search-button');
    const resultsContainer = document.getElementById('results-container');
    
    // ✅ IMPORTANT: PASTE YOUR ADZUNA KEYS HERE
    const adzunaAppId = '8cd22dc4';
    const adzunaAppKey = '5f59c4709a07dbbd781fead08e9c716d';

    async function searchProjects(query) {
        resultsContainer.innerHTML = '<p>Searching...</p>';
        
        // This is the correct API URL for Adzuna, for searches in India (in)
        const url = `https://api.adzuna.com/v1/api/jobs/in/search/1?app_id=${adzunaAppId}&app_key=${adzunaAppKey}&results_per_page=20&what=${encodeURIComponent(query)}`;

        try {
            const response = await fetch(url);
            const result = await response.json();
            
            // Adzuna nests the results in a 'results' array
            displayResults(result.results);

        } catch (error) {
            console.error("Adzuna API Error:", error);
            resultsContainer.innerHTML = '<p>Error fetching projects. Please try again later.</p>';
        }
    }

    function displayResults(projects) {
        if (!projects || projects.length === 0) {
            resultsContainer.innerHTML = '<p>No projects or internships found for this search. Please try a different keyword.</p>';
            return;
        }

        resultsContainer.innerHTML = ''; // Clear the "Searching..." message

        projects.forEach(project => {
            const card = document.createElement('div');
            card.className = 'project-card';

            const title = project.title;
            const company = project.company.display_name;
            const location = project.location.display_name;
            const description = project.description;
            const applyLink = project.redirect_url; // Adzuna provides a direct application link

            card.innerHTML = `
                <div class="project-title">${title}</div>
                <div class="company-name">${company} - ${location}</div>
                <p>${description}</p>
                <a href="${applyLink}" class="apply-link" target="_blank">View & Apply</a>
            `;
            resultsContainer.appendChild(card);
        });
    }

    // Event Listeners (no changes needed here)
    searchButton.addEventListener('click', () => {
        const query = searchInput.value;
        if (query) {
            searchProjects(query);
        }
    });

    // Initial search when the page loads
    window.addEventListener('load', () => {
        searchProjects('internship'); // A simple, broad search for internships to start
    });

</script>

</body>
</html>
