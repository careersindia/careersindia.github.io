<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Internships & Projects</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Teko:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --aquamarine: #7FFFD4;
            --white: #FFFFFF;
            --black-font: #2c3e50;
            --grey-bg: #f4f6f8;
            --border-color: #e0e0e0;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--grey-bg);
            margin: 0;
            padding: 40px 20px;
            color: var(--black-font);
        }

        .main-container {
            display: grid;
            grid-template-columns: 350px 1fr; /* Left column fixed, right column flexible */
            gap: 40px;
            max-width: 1400px;
            margin: auto;
            background-color: var(--white);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px var(--shadow-color);
        }

        /* --- STYLISH 3D TITLE BOX --- */
        .title-box {
            grid-column: 1 / -1; /* Span both columns */
            background-color: var(--aquamarine);
            color: var(--black-font);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
            border: 3px solid var(--black-font);
            position: relative;
        }

        .title-box h1 {
            font-family: 'Teko', sans-serif;
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            /* 3D Effect */
            text-shadow: 
                -1px -1px 0 #fff,  
                 1px -1px 0 #fff,
                -1px  1px 0 #fff,
                 1px  1px 0 #fff, /* White outline */
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000; /* Black shadow */
        }
        
        /* --- LEFT COLUMN: SEARCH PANEL --- */
        .search-panel {
            background-color: var(--grey-bg);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            position: sticky; /* Sticks on the side when scrolling */
            top: 40px;
        }

        .search-panel h3 {
            margin-top: 0;
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--aquamarine);
            padding-bottom: 10px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }

        .input-group input {
            width: 100%;
            padding: 12px 12px 12px 45px;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
        }

        #search-button {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            background-color: var(--black-font);
            color: var(--white);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #search-button:hover {
            background-color: var(--aquamarine);
            color: var(--black-font);
        }

        /* --- RIGHT COLUMN: RESULTS --- */
        .results-panel {
            max-height: 80vh; /* Make it scrollable if content overflows */
            overflow-y: auto;
            padding-right: 15px; /* Space for scrollbar */
        }

        .project-card {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--aquamarine);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px var(--shadow-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .project-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin: 0 0 5px 0;
        }

        .company-name {
            font-weight: 600;
            color: #555;
            margin-bottom: 15px;
        }
        
        .project-card p { /* Description */
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .apply-link {
            display: inline-block;
            padding: 10px 18px;
            background-color: var(--aquamarine);
            color: var(--black-font);
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            transition: background-color 0.3s ease;
        }
        .apply-link:hover {
            background-color: var(--black-font);
            color: var(--white);
        }
        
        /* --- RESPONSIVE DESIGN FOR MOBILE --- */
        @media (max-width: 992px) {
            .main-container {
                grid-template-columns: 1fr; /* Stack columns on smaller screens */
            }
            .search-panel {
                position: static; /* Un-stick the search panel */
            }
            .results-panel {
                max-height: none;
                overflow-y: visible;
            }
            .title-box h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

<div class="main-container">

    <div class="title-box">
        <h1><i class="fas fa-briefcase"></i> Live Projects for Interns</h1>
    </div>

    <!-- LEFT COLUMN: SEARCH PANEL -->
    <aside class="search-panel">
        <h3><i class="fas fa-filter"></i> Refine Your Search</h3>
        <div class="input-group">
            <i class="fas fa-search"></i>
            <input type="text" id="field-search" placeholder="Field (e.g., Web Development)">
        </div>
        <div class="input-group">
            <i class="fas fa-map-marker-alt"></i>
            <input type="text" id="city-search" placeholder="City (e.g., Mumbai)">
        </div>
        <button id="search-button"><i class="fas fa-paper-plane"></i> Find Projects</button>
    </aside>

    <!-- RIGHT COLUMN: RESULTS PANEL -->
    <main class="results-panel" id="results-container">
        <p style="text-align:center;">Loading initial projects...</p>
    </main>
</div>

<script>
    const fieldInput = document.getElementById('field-search');
    const cityInput = document.getElementById('city-search');
    const searchButton = document.getElementById('search-button');
    const resultsContainer = document.getElementById('results-container');
    
    // ✅ PASTE YOUR ADZUNA KEYS HERE
    const adzunaAppId = '8cd22dc4';
    const adzunaAppKey = '5f59c4709a07dbbd781fead08e9c716d';

    async function searchProjects() {
        resultsContainer.innerHTML = '<p style="text-align:center;">Searching...</p>';
        
        const fieldQuery = fieldInput.value.trim();
        const cityQuery = cityInput.value.trim();

        if (!fieldQuery && !cityQuery) {
            resultsContainer.innerHTML = '<p style="text-align:center;">Please enter a field or city to search.</p>';
            return;
        }

        let whatQuery = fieldQuery;
        let whereQuery = cityQuery || 'India'; // Default to India if no city is entered

        const url = `https://api.adzuna.com/v1/api/jobs/in/search/1?app_id=${adzunaAppId}&app_key=${adzunaAppKey}&results_per_page=50&what=${encodeURIComponent(whatQuery)}&where=${encodeURIComponent(whereQuery)}`;

        try {
            const response = await fetch(url);
            const result = await response.json();
            displayResults(result.results);
        } catch (error) {
            console.error("Adzuna API Error:", error);
            resultsContainer.innerHTML = '<p style="text-align:center;">Error fetching projects. Please try again later.</p>';
        }
    }

    function displayResults(projects) {
        if (!projects || projects.length === 0) {
            resultsContainer.innerHTML = '<p style="text-align:center;">No projects or internships found for this search. Please try a different keyword.</p>';
            return;
        }
        resultsContainer.innerHTML = '';
        projects.forEach(project => {
            const card = document.createElement('div');
            card.className = 'project-card';
            
            // Sanitize and shorten the description
            let description = project.description;
            description = description.replace(/<[^>]*>?/gm, ''); // Remove HTML tags
            if (description.length > 200) {
                description = description.substring(0, 200) + '...';
            }

            card.innerHTML = `
                <div class="project-title">${project.title}</div>
                <div class="company-name"><i class="fas fa-building"></i> ${project.company.display_name} - <i class="fas fa-map-pin"></i> ${project.location.display_name}</div>
                <p>${description}</p>
                <a href="${project.redirect_url}" class="apply-link" target="_blank">View & Apply <i class="fas fa-external-link-alt"></i></a>
            `;
            resultsContainer.appendChild(card);
        });
    }

    // Event Listeners
    searchButton.addEventListener('click', searchProjects);

    // Initial search when the page loads
    window.addEventListener('load', () => {
        fieldInput.value = 'internship'; // Set a default search
        searchProjects();
    });
</script>

</body>
</html>
