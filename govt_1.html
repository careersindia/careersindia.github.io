<style>
    :root {
        --primary-color: #0056b3;
        --secondary-color: #4A90E2;
        --text-dark: #333;
        --text-light: #666;
        --bg-light: #f4f7f9;
        --bg-white: #ffffff;
        --border-color: #e0e0e0;
        --shadow: 0 4px 12px rgba(0,0,0,0.08);
    }
    body { font-family: 'Poppins', sans-serif; background-color: var(--bg-light); color: var(--text-dark); line-height: 1.6; margin: 0; }
    .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
    .header { text-align: center; margin-bottom: 40px; }
    .header h1 { font-size: 2.2rem; font-weight: 700; color: var(--primary-color); margin-bottom: 10px; }
    
    /* PREVENTS PAGE JUMPING */
    .dashboard-wrapper { min-height: 1800px; display: flex; flex-direction: column; gap: 30px; }

    /* VISIBLE BUTTON LIST SLICERS */
    .slicer-container { 
        display: flex; 
        flex-wrap: wrap; 
        gap: 20px; 
        background: #fff; 
        padding: 20px; 
        border-radius: 12px; 
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow);
    }
    .slicer-box { flex: 1; min-width: 260px; }
    .slicer-box label { font-weight: 700; color: var(--primary-color); display: block; margin-bottom: 10px; font-size: 0.85rem; text-transform: uppercase; }
    
    .slicer-list { 
        height: 160px; 
        overflow-y: auto; 
        border: 1px solid #ddd; 
        border-radius: 6px; 
        background: #fdfdfd; 
    }
    .slicer-item { 
        padding: 8px 12px; 
        cursor: pointer; 
        border-bottom: 1px solid #eee; 
        font-size: 0.85rem; 
        transition: all 0.2s;
    }
    .slicer-item:hover { background: #f0f7ff; }
    .slicer-item.active { background: var(--primary-color); color: #fff; font-weight: 600; }

    /* VIEW LIMIT SLICER */
    .limit-box { background: #eef5ff; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #cce0ff; }
    .limit-box select { padding: 8px; border-radius: 4px; border: 1px solid var(--primary-color); font-family: 'Poppins'; cursor: pointer; }

    /* CHART BOXES */
    .chart-box { 
        background: #fff; 
        padding: 20px; 
        border-radius: 12px; 
        box-shadow: var(--shadow); 
        border: 1px solid #eee; 
        height: 500px; /* Locks height to prevent jumping */
    }

    .footer { text-align: center; margin-top: 50px; padding: 20px; border-top: 1px solid var(--border-color); color: var(--text-light); }
    .home-button-container { position: fixed; top: 20px; right: 25px; z-index: 1000; }
    .home-button-container a img { width: 50px; height: 50px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); transition: transform 0.2s; }
    .home-button-container a:hover img { transform: scale(1.1); }
</style>
</head>
<body>

    <div class="container">
        <header class="header">
           <h1>Government Job Salary Analysis</h1>
            <p>Compare UPSC, SSC, Banking, and Railway examinations based on pay scale and qualifications.</p>
        </header>

        <main class="dashboard-wrapper">
            <!-- INTERACTIVE SLICERS -->
            <div class="slicer-container">
                <div class="slicer-box">
                    <label>Exam Board / Category</label>
                    <div id="catList" class="slicer-list"></div>
                </div>
                <div class="slicer-box">
                    <label>Min Qualification (Years post-10th)</label>
                    <div id="qualList" class="slicer-list"></div>
                </div>
                <div class="slicer-box" style="max-width: 220px;">
                    <label>Display Preferences</label>
                    <div class="limit-box">
                        <span>Show Records:</span>
                        <select id="limitSlicer" onchange="drawCharts()">
                            <option value="5">Top 5</option>
                            <option value="10">Top 10</option>
                            <option value="20">Full List</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- VISUALIZATIONS -->
            <div class="chart-box">
                <div id="bar_chart_div" style="width: 100%; height: 100%;"></div>
            </div>
            <div class="chart-box">
                <div id="horiz_chart_div" style="width: 100%; height: 100%;"></div>
            </div>
            <div class="chart-box">
                <div id="line_chart_div" style="width: 100%; height: 100%;"></div>
            </div>
        </main>
        
        <footer class="footer">
            <p>&copy; 2024 Career Pathways India. Salary data includes basic pay + DA/HRA estimates.</p>
        </footer>
    </div>

<div class="home-button-container">
  <a href="/mainnow.html" title="Go to Home">
    <img src="images/home-icon.png" alt="Home">
  </a>
</div>

<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

    google.charts.setOnLoadCallback(() => { initDashboard(); });

    {name: 'DRDO Scientist', cat: 'Other Govt', min: 9.5, max: 12.0, dur: 7, demand: 9},
    {name: 'PSU Graduate Trainee (GATE)', cat: 'Other Govt', min: 8.0, max: 15.0, dur: 5, demand: 9}

    let selectedCat = "UPSC";
    let selectedQual = 5; // Qualification (Graduate level)

    function initDashboard() {
        if(dataset.length === 0) {
            document.querySelectorAll('.chart-box').forEach(el => el.innerHTML = "<p style='padding:20px; color:red;'>JSON Data Missing: Please paste the dataset into the script block.</p>");
            return;
        }
        createSlicer('catList', 'cat', (v) => { selectedCat = v; drawCharts(); });
        createSlicer('qualList', 'dur', (v) => { selectedQual = parseFloat(v); drawCharts(); });
        drawCharts();
    }

    function createSlicer(elementId, key, callback) {
        const container = document.getElementById(elementId);
        const uniqueValues = [...new Set(dataset.map(d => d[key]))].sort((a,b) => (typeof a === 'number' ? a-b : a.localeCompare(b)));

        uniqueValues.forEach(val => {
            const item = document.createElement('div');
            item.className = 'slicer-item' + (val == (key === 'cat' ? selectedCat : selectedQual) ? ' active' : '');
            
            // Friendly labels for qualification levels
            let label = val;
            if (key === 'dur') {
                if (val === 0) label = "10th Pass";
                else if (val === 2) label = "12th Pass";
                else if (val === 3) label = "Diploma";
                else if (val === 5) label = "Graduate";
                else if (val > 5) label = "PG / Specialist";
            }
            
            item.innerText = label;
            item.onclick = function() {
                Array.from(container.children).forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                callback(val);
            };
            container.appendChild(item);
        });
    }

    function drawCharts() {
        const limit = parseInt(document.getElementById('limitSlicer').value);

        // Chart 1: Vertical Bar (Category vs Salary)
        const d1 = new google.visualization.DataTable();
        d1.addColumn('string', 'Exam Name'); d1.addColumn('number', 'Min Salary'); d1.addColumn('number', 'Max Salary');
        dataset.filter(x => x.cat === selectedCat).slice(0, limit).forEach(x => d1.addRow([x.name, x.min, x.max]));
        new google.visualization.ColumnChart(document.getElementById('bar_chart_div')).draw(d1, {
            title: `Salary Range: ${selectedCat} Exams (Top ${limit})`, colors: ['#4A90E2', '#0056b3'], legend: 'top', animation: {startup: true, duration: 500}
        });

        // Chart 2: Horizontal Bar (Qualification level filter)
        const d2 = new google.visualization.DataTable();
        d2.addColumn('string', 'Exam Name'); d2.addColumn('number', 'Max Salary');
        dataset.filter(x => x.dur === selectedQual).slice(0, limit).forEach(x => d2.addRow([x.name, x.max]));
        new google.visualization.BarChart(document.getElementById('horiz_chart_div')).draw(d2, {
            title: `Market Value by Qualification Level (Top ${limit})`, colors: ['#28a745'], legend: 'none'
        });

        // Chart 3: Line Chart (Category vs Demand)
        const d3 = new google.visualization.DataTable();
        d3.addColumn('string', 'Exam Name'); d3.addColumn('number', 'Demand');
        dataset.filter(x => x.cat === selectedCat).slice(0, limit).forEach(x => d3.addRow([x.name, x.demand]));
        new google.visualization.LineChart(document.getElementById('line_chart_div')).draw(d3, {
            title: `Popularity/Demand Index: ${selectedCat}`, colors: ['#FF9900'], pointsVisible: true, curveType: 'function', vAxis: {minValue: 0, maxValue: 10}
        });
    }

    window.onresize = drawCharts;
</script>
