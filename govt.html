Paper I: General Studies (GS) (200 marks; 100 questions; 2 hours)

Qualifying Papers (Marks not counted for final ranking)

        - Effect of policies and politics of developed and developing countries on India’s interests, Indian diaspora.
        - Important International institutions, agencies and fora- their structure, mandate.

        - Indian Economy and issues relating to planning, mobilization of resources, growth, development and employment.

        - Science and Technology- developments and their applications and effects in everyday life.
        - Achievements of Indians in science & technology; indigenization of technology.
        - Awareness in the fields of IT, Space, Computers, robotics, nano-technology, bio-technology and issues relating to intellectual property rights.

        - Role of external state and non-state actors in creating challenges to internal security.

Stage I: Preliminary Examination (Objective Type) - Common with the Civil Services Exam

This is the most important point to understand: The IFoS Preliminary Exam is the exact same paper as the UPSC Civil Services Preliminary Exam.

Crucial Difference: The cut-off score for qualifying for the IFoS Main Exam is calculated separately and is generally much higher than the cut-off for the CSE Main Exam.

The syllabus is therefore identical to the CSE Prelims:

Paper I: General Studies (GS) (200 marks)
(Syllabus includes Current Events, History of India, Geography, Indian Polity, Economy, Environment, General Science.)

Paper II: Civil Services Aptitude Test (CSAT) (200 marks)
(This is a qualifying paper where you must score 33%. Syllabus includes Comprehension, Logical Reasoning, Basic Numeracy, etc.)

Stage II: Main Examination (Written) (Total: 1400 Marks)

This is where the IFoS exam diverges completely. The structure consists of 6 descriptive papers.

Paper I: General English (300 Marks)
Paper II: General Knowledge (300 Marks)
Paper III: Optional Subject I - Paper 1 (200 Marks)
Paper IV: Optional Subject I - Paper 2 (200 Marks)
Paper V: Optional Subject II - Paper 1 (200 Marks)
Paper VI: Optional Subject II - Paper 2 (200 Marks)

Syllabus for Main Papers

Paper I: General English (300 Marks)
- Candidates will be required to write an essay in English.
- Other questions will be designed to test their understanding of English and workmanlike use of words.
- Passages will usually be set for summary or précis.
- The standard of the paper is that of a science or engineering graduate.

Paper II: General Knowledge (300 Marks)
- This paper is different from the CSE General Studies papers. It requires general awareness without specialized study.
- Current Events: Knowledge of significant national and international events.
- Indian Polity including the political system and the Constitution of India: This includes the basics of the Indian Constitution, Panchayati Raj, Public Policy, and rights issues.
- History of India: A broad overview of the social, economic, and political aspects of Indian history.
- Geography of a nature which the candidate should be able to answer without special study: General geographical awareness of India and the world.
- Indian Economy: Basic understanding of the Indian economy, planning, and economic development.
- General Science & Environment: Questions will test general appreciation and understanding of science and environment, including matters of everyday observation and experience.

Papers III, IV, V & VI: Optional Subjects
This is the core of the IFoS Main Exam. Candidates must choose TWO optional subjects from the list below. Each subject has two papers (Paper 1 & Paper 2), each worth 200 marks.

List of Optional Subjects for IFoS:
Agriculture, Agricultural Engineering, Animal Husbandry & Veterinary Science, Botany, Chemistry, Chemical Engineering, Civil Engineering, Forestry, Geology, Mathematics, Mechanical Engineering, Physics, Statistics, Zoology.

Important Restrictions on Subject Combinations:
Candidates cannot choose the following combinations of subjects:
- Agriculture and Agricultural Engineering
- Agriculture and Animal Husbandry & Veterinary Science
- Agriculture and Forestry
- Chemistry and Chemical Engineering
- Mathematics and Statistics

Interest in outdoor life, nature, and wildlife is a significant plus.

Final Ranking = Marks from Main Exam (1400) + Marks from Interview (300) = 1700 Total Marks.

        syllabus: `
The exam consists of objective-type questions.

1. For Admission to Indian Military Academy (IMA), Indian Naval Academy (INA), and Air Force Academy (AFA):
    - Paper I: English (2 Hours, 100 Marks)
    - Paper II: General Knowledge (2 Hours, 100 Marks)
    - Paper III: Elementary Mathematics (2 Hours, 100 Marks)

2. For Admission to Officers' Training Academy (OTA):
    - Paper I: English (2 Hours, 100 Marks)
    - Paper II: General Knowledge (2 Hours, 100 Marks)
    (Note: OTA candidates do not have to sit for the Mathematics paper.)

Detailed Syllabus for Each Subject

English
The paper is designed to test the candidate's understanding of English and the workmanlike use of words.
    - Vocabulary: Synonyms, Antonyms, Cloze Test, Fill in the Blanks.
    - Grammar and Usage: Spotting Errors, Sentence Improvement.
    - Comprehension: Reading passages and answering questions based on them.
    - Ordering: Ordering of Words in a Sentence, Ordering of Sentences (Para Jumbles).

General Knowledge (GK)
This section tests a candidate's general awareness of a broad range of subjects.
    - Current Affairs: Knowledge of important national and international events from the last 6-8 months.
    - History: Focus on the Indian Freedom Struggle, with a general understanding of Ancient and Medieval India.
    - Geography: Physical, Social, and Economic Geography of India and the World.
    - Indian Polity: Indian Constitution, Panchayati Raj, basic political system, and governance.
    - Economics: Basic concepts of the Indian economy, Five-Year Plans, and recent developments.
    - General Science: Physics, Chemistry, and Biology of Class IX and X level.
    - Defence-related News: Important military exercises, new acquisitions, etc.

Elementary Mathematics
The standard of this paper is Matriculation (Class 10) level.
    - Arithmetic: Number System, Time & Distance, Time & Work, Percentages, Profit & Loss, Simple & Compound Interest.
    - Algebra: Basic Operations, Simple Factors, HCF & LCM, Quadratic Equations.
    - Trigonometry: Sine, Cosine, Tangent ratios, Simple Trigonometric Identities, Heights and Distances.
    - Geometry: Lines and Angles, Triangles, Circles, Quadrilaterals, and their properties.
    - Mensuration: Area of Squares, Rectangles, Triangles, Circles; Surface Area and Volume of Cuboids, Spheres, Cylinders.
    - Statistics: Collection and Tabulation of Data, Pie Charts, Bar Charts, Histograms.

    - Igneous and Metamorphic Petrology: Magma, forms of igneous rocks, textures, metamorphic processes, textures, facies.

    - Paleontology: Fossils, modes of preservation, morphology and geological history of important fossils.
    - Stratigraphy: Principles of stratigraphy, geological time scale, stratigraphy of major geological systems in India.
    - Economic Geology: Ore deposits, processes of ore formation, major mineral deposits of India.
    - Hydrogeology: Groundwater, aquifers, porosity, permeability, Darcy's law.

Stage II: Main Examination (Descriptive Type - 600 Marks)

Paper I: Geology Paper-I (200 Marks, 3 Hours)
    - Physical Geology and Geomorphology
    - Structural Geology
    - Crystallography and Mineralogy
    - Geochemistry and Isotope Geology

Paper II: Geology Paper-II (200 Marks, 3 Hours)
    - Igneous Petrology
    - Metamorphic Petrology
    - Sedimentology
    - Paleontology
    - Stratigraphy

Paper III: Geology Paper-III (200 Marks, 3 Hours)
    - Economic Geology
    - Indian Mineral Deposits
    - Mineral Exploration
    - Engineering Geology and Geohazards
    - Environmental Geology and an introduction to remote sensing.

Stage III: Personality Test / Interview (200 Marks)

    - General Intelligence (Reasoning) (25 Questions, 50 Marks):

        - History of India and Indian National Movement.
        - Indian and World Geography - Physical, Social, Economic.
        - Indian Polity and Governance - Constitution, Political System, Panchayati Raj.
        - Economic and Social Development - Sustainable Development, Poverty, Inclusion.
        - General issues on Environmental ecology, Bio-diversity and Climate Change.
        - General Science.
        - History, Geography, Economy, Art & Culture, and Polity of the specific STATE. (This is the most important part).

        - Comprehension, Interpersonal skills, Logical reasoning, Decision making, General mental ability, Basic numeracy (Class X level).

(The number of papers and subjects vary significantly from state to state.)

    - General Hindi & General English: Papers on language skills, often including essay, précis, and grammar.

The selection process is typically a three-stage journey:
1. Preliminary Examination (Objective - MCQ, Qualifying)
2. Main Examination (Descriptive - Written)
3. Interview (Viva-voce)

Syllabus for Preliminary Examination
(Pattern and marking schemes vary by state.)

The Prelims exam usually consists of two papers, or a single paper with two parts.

    - Paper I: Law
        This is an objective test covering the major laws.
        - Substantive Law: Indian Contract Act, Indian Penal Code (IPC), Constitution of India, Transfer of Property Act, Law of Torts, Hindu Law, Muslim Law.
        - Procedural Law: Code of Civil Procedure (CPC), Code of Criminal Procedure (CrPC), Indian Evidence Act.
        - State-Specific Local Laws: Each state has its own set of local laws that are very important (e.g., Rent Control Act, Land Revenue Code of that state).

    - Paper II: General Knowledge & Language
        - General Knowledge: Indian History, Geography, Polity, Economy, and Current Affairs.
        - Language: General English (Grammar, Vocabulary, Comprehension) and often the local language of the state.

Syllabus for Main Examination
(This is a descriptive, written exam with multiple papers.)

The structure varies greatly, but it generally includes:
    - Paper I: General Knowledge & Current Affairs: A descriptive paper on general topics.
    - Paper II: Language: Translation (English to local language and vice-versa), Essay writing, and Précis writing.
    - Paper III: Substantive Law: Detailed, problem-based questions on the Indian Contract Act, Partnership Act, Torts, Transfer of Property Act, Hindu Law, Muslim Law, etc.
    - Paper IV: Procedural Law: In-depth questions on the Code of Civil Procedure (CPC), Code of Criminal Procedure (CrPC), and the Indian Evidence Act.
    - Paper V: Local Laws and Penal Code: This paper focuses on the Indian Penal Code (IPC) and the specific local laws of the state. This is often a deciding factor.

"IndiaPost-GDS": {
                name: "India Post - Gramin Dak Sevak (GDS)",
                syllabus: `
It's crucial to understand that the selection process for Gramin Dak Sevak (GDS) is completely different from other government exams.

THERE IS NO WRITTEN EXAMINATION FOR THE GDS POST.

Therefore, there is no syllabus to study for and no "best books" to prepare from in the traditional sense.

Selection Process (No Exam):
The selection is based entirely on a merit list generated from the candidate's marks in the 10th Standard (Matriculation) examination.
- A system-generated merit list is prepared automatically based on the percentage of marks obtained in the 10th standard.
- Having higher educational qualifications (like 12th pass or graduation) provides no extra weightage or preference. Only 10th-class marks matter.

Posts Covered:
This is a combined recruitment for three main roles:
1. Branch Postmaster (BPM): Manages the entire Gram Panchayat Post Office.
2. Assistant Branch Postmaster (ABPM): Assists the BPM in all tasks, including sales and door-step services.
3. Dak Sevak: Primarily involved in the collection and delivery of mail (postman duties).

                syllabus: `
The selection process is typically a single-stage Computer Based Test (CBT) followed by Document Verification and a Medical Examination.

Syllabus for Computer Based Test (CBT)
(Duration: 90 Minutes | Total Questions: 100 | Total Marks: 100 | Negative Marking: 1/3rd for each wrong answer)

The CBT is divided into two main parts, with a heavy emphasis on the professional subject.

Part A: Common Syllabus (30 Marks)

    - General Awareness (10 Questions):
        Knowledge of Current affairs, Indian geography, culture and history of India including freedom struggle, Indian Polity and constitution, Indian Economy, Environmental issues concerning India and the World, Sports, General scientific and technological developments.

    - General Arithmetic, General Intelligence & Reasoning (10 Questions):
        Arithmetic: Number systems, BODMAS, Decimals, Fractions, LCM, HCF, Ratio and Proportion, Percentages, Mensuration, Time and Work, Time and Distance, Simple and Compound Interest, Profit and Loss.
        Reasoning: Analogies, Alphabetical and Number Series, Coding and Decoding, Relationships, Syllogism, Jumbling, Venn Diagram, Conclusions and Decision Making.

    - General Science (10 Questions):
        Physics, Chemistry and Life Sciences (up to 10th Standard CBSE level).

Part B: Professional Ability / Technical Subject (70 Marks)

This is the most important section, carrying 70% of the total weightage.
The syllabus for this section is specific to the paramedical post for which the candidate has applied. It is based on the academic curriculum of the qualifying diploma/degree for that post.

Example Syllabus for Major Posts:
    - For Staff Nurse: Anatomy, Physiology, Nutrition, Biochemistry, Nursing Foundations, Psychology, Microbiology, Sociology, Pharmacology, Pathology, Medical-Surgical Nursing, Child Health Nursing, Midwifery and Gynecological Nursing, Community Health Nursing, Mental Health Nursing.

    - For Lab Assistant / Technician: Biochemistry, Microbiology, Haematology, Blood Banking, and Histopathology.
    - For Radiographer: Human Anatomy & Physiology, Radiography, Radiation Physics, and Imaging techniques.

"ISRO-Scientist-Engineer": {
                name: "ISRO Scientist/Engineer 'SC' Exam",
                syllabus: `
The Indian Space Research Organisation (ISRO) conducts its recruitment for Scientist/Engineer 'SC' through its centralized recruitment board, ICRB. The process typically involves a written test and an interview.

Written Test (Objective - MCQ)
(Typically 2 Hours | 80-100 Questions | Negative Marking: 1/3rd for each wrong answer)

The written test is a comprehensive assessment of the candidate's core engineering/science knowledge at the B.E./B.Tech/M.Sc. level. The syllabus is based on the curriculum of the qualifying degree. There is no separate section for general aptitude or reasoning in the main technical paper.

The syllabus is discipline-specific.

    - For Electronics Engineering (EC):
        Topics: Networks, Signals & Systems, Control Systems, Electronic Devices, Analog Circuits, Digital Circuits, Electromagnetics, Communications. (Syllabus is very similar to the GATE exam for EC).

    - For Mechanical Engineering (ME):
        Topics: Engineering Mechanics, Strength of Materials, Theory of Machines, Vibrations, Design, Fluid Mechanics, Heat-Transfer, Thermodynamics, Engineering Materials, Production and Manufacturing, Operations Research. (Syllabus is very similar to the GATE exam for ME).

    - For Computer Science (CS):
        Topics: Theory of Computation, Digital Logic, Computer Organization and Architecture, Programming and Data Structures, Algorithms, Compiler Design, Operating System, Databases, Computer Networks. (Syllabus is very similar to the GATE exam for CS).

    - For other disciplines (e.g., Civil, Electrical):
        The syllabus will be based on the standard curriculum of the respective B.E./B.Tech degree.

Interview
Candidates shortlisted based on the written test performance are called for an interview.
- The interview is highly technical and concept-driven.
- The panel consists of senior scientists from ISRO who assess the candidate's fundamental understanding of their engineering/science discipline in great depth.
- Questions are based on the candidate's favorite subjects mentioned in their application and core engineering principles.
- The final selection is based 100% on the interview performance. The written test is only for screening/shortlisting.
                `,
                months: "Recruitment is not on a fixed annual cycle. Notifications are published on the ISRO careers website as and when vacancies arise for specific disciplines. This can happen multiple times a year.",
                eligibility: "B.E./B.Tech or equivalent degree in the relevant discipline with a minimum of 65% marks or a CGPA of 6.84/10. (For M.Sc. candidates, the requirements are similar).",
                ageLimit: "Typically 28 or 30 years as on the closing date of application. Age relaxation is applicable for reserved categories (SC/ST/OBC/PwD/ESM) as per government rules.",
                facilities: "An opportunity to work at the forefront of space technology in one of the world's leading space agencies. It's a highly prestigious Group 'A' Gazetted post with an excellent salary, medical benefits for self and dependents (CHSS), subsidized housing in ISRO quarters, transport facilities, and opportunities to pursue higher studies (M.Tech/Ph.D.) sponsored by ISRO.",
                selectionProcess: "1. Written Test (Objective MCQ). 2. Personal Interview. The written test is purely for screening; the final selection is based solely on the performance in the interview.",

- Written Test: An objective MCQ paper focused entirely on the specific technical discipline.
