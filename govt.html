document.addEventListener('DOMContentLoaded', function() {

            const examKeys = Object.keys(examData);
            examKeys.sort((a, b) => examData[a].name.localeCompare(examData[b].name));
            
            examKeys.forEach(key => {
                const option1 = document.createElement('option');
                option1.value = key;
                option1.textContent = examData[key].name;
                const option2 = option1.cloneNode(true);
                const option3 = option1.cloneNode(true);
                examDropdown.appendChild(option1);
                compareExam1.appendChild(option2);
                compareExam2.appendChild(option3);
            });

            // CORRECTED: This is the full 16-point display function
            function displayExamDetails(examKey) {
                compareExam1.value = '';
                compareExam2.value = '';
                const data = examData[examKey];
                if (!data) {
                    detailsContainer.innerHTML = '<p>Please select a valid exam.</p>';
                    return;
                }
                const booksHtml = (data.books && data.books.length > 0) 
                    ? data.books.map(book => book.title).join('') 
                    : '<ul><li>No specific book recommendations available.</li></ul>';
                const hiringOrgsHtml = data.hiringOrgs.map(org => `<li style="background-color: white;">${org}</li>`).join('');

                detailsContainer.innerHTML = `
                    <h2 style="background-color: aquamarine;">${data.name}</h2>
                    <h2 style="background-color: aquamarine;">1. Complete Syllabus Details</h2>
                    <pre>${data.syllabus.trim()}</pre>
                    <h2 style="background-color: aquamarine;">2. Months of Exam Conduct</h2><p>${data.months}</p>
                    <h2 style="background-color: aquamarine;">3. Eligibility for the Exam</h2><p>${data.eligibility}</p>

                    <h2 style="background-color: aquamarine;">6. Selection Process</h2><pre>${data.selectionProcess}</pre>
                    <h2 style="background-color: aquamarine;">7. Exam Pattern</h2><pre>${data.examPattern}</pre>
                    <h2 style="background-color: aquamarine;">8. Duration of the Exam</h2><p>${data.duration}</p>
                    <h2 style="background-color: aquamarine;">9. Time of Results</h2><p>${data.resultsTime}</p>
                    <h2 style="background-color: aquamarine;">10. Scope of Exam</h2><p>${data.scope}</p>
                    <h2 style="background-color: aquamarine;">11. Starting Salary (Indicative)</h2><p>${data.startingSalary}</p>
                    <h2 style="background-color: aquamarine;">12. Starting Post</h2><p>${data.startingPost}</p>
                    <h2 style="background-color: aquamarine;">13. Fees for the Exam (Indicative)</h2><p>${data.fees}</p>
                    <h2 style="background-color: aquamarine;">14. Top Potential Hiring Organisations</h2><ul>${hiringOrgsHtml}</ul>
                    <h2 style="background-color: aquamarine;">15. Website</h2><p><a href="${data.website}" target="_blank">${data.website}</a></p>
                    <h2 style="background-color: aquamarine;">16. Best Books for Preparation</h2>${booksHtml}
                `;
            }
            
            function displayComparison(key1, key2) {
                examDropdown.value = '';
                searchByNameInput.value = '';
                const data1 = examData[key1];
                const data2 = examData[key2];
                const fields = [
                    { label: "Name of the Exam", key: "name" },
                    { label: "Eligibility", key: "eligibility" },
                    { label: "Age Limit", key: "ageLimit" },
                    { label: "Start Salary", key: "startingSalary" },
                    { label: "Starting Post", key: "startingPost" },
                    { label: "Fees", key: "fees" },
                    { label: "Facilities", key: "facilities" }
                ];
                let tableHtml = `
                    <h2 style="text-align:center;">Exam Comparison</h2>
                    <table class="comparison-table">
                        <thead>
                            <tr>
                                <th>Feature</th>
                                <th>${data1.name}</th>
                                <th>${data2.name}</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                fields.forEach(field => {
                    tableHtml += `
                        <tr>
                            <td>${field.label}</td>
                            <td>${data1[field.key]}</td>
                            <td>${data2[field.key]}</td>
                        </tr>
                    `;
                });
                tableHtml += `</tbody></table>`;
                detailsContainer.innerHTML = tableHtml;
            }

            examDropdown.addEventListener('change', function() {
                if (this.value) {
                    displayExamDetails(this.value);
                } else {
                    detailsContainer.innerHTML = '<p>Please select an exam from the left panel to see the details.</p>';
                }
            });
            
            searchByNameInput.addEventListener('keyup', function() {
                const input = this.value.toLowerCase();
                autocompleteList.innerHTML = '';
                if (input.length < 2) return;

                const filteredKeys = examKeys.filter(key => 
                    examData[key].name.toLowerCase().includes(input)
                );

                filteredKeys.forEach(key => {
                    const item = document.createElement('div');
                    item.textContent = examData[key].name;
                    item.addEventListener('click', () => {
                        searchByNameInput.value = examData[key].name;
                        autocompleteList.innerHTML = '';
                        examDropdown.value = key;
                        displayExamDetails(key);
                    });
                    autocompleteList.appendChild(item);
                });
            });

            compareBtn.addEventListener('click', function() {
                const key1 = compareExam1.value;
                const key2 = compareExam2.value;
                if (!key1 || !key2) {
                    alert('Please select two exams to compare.');
                    return;
                }
                if (key1 === key2) {
                    alert('Please select two different exams for comparison.');
                    return;
                }
                displayComparison(key1, key2);
            });
        });
    </script>
