        let selectedCat = "Engineering";

        function initializeDashboard() {
            createSlicer('catList', 'cat', (val) => { selectedCat = val; drawCharts(); });
            createSlicer('durList', 'dur', (val) => { selectedDur = parseFloat(val); drawCharts(); });
            drawCharts();
        }

        // Logic to create visible button-list slicers
        function createSlicer(elementId, key, callback) {
            const container = document.getElementById(elementId);
            const uniqueValues = [...new Set(dataset.map(item => item[key]))].sort();

            uniqueValues.forEach(val => {
                const item = document.createElement('div');
                item.className = 'slicer-item' + (val == (key === 'cat' ? selectedCat : selectedDur) ? ' active' : '');
                item.innerText = (key === 'dur') ? val + " Year(s)" : val;
                
                item.onclick = function() {
                    Array.from(container.children).forEach(child => child.classList.remove('active'));
                    this.classList.add('active');
                    callback(val);
                };
                container.appendChild(item);
            });
        }

   function drawCharts() {
    // 1. Get the current user choices from slicers
    const limit = parseInt(document.getElementById('limitSlicer').value);
    const cat = selectedCat; // from the global variable updated by the slicer
    const dur = selectedDur; // from the global variable updated by the slicer

    // --- CHART 1: VERTICAL BAR (Category vs Salary) ---
    const data1 = new google.visualization.DataTable();
    data1.addColumn('string', 'Course');
    data1.addColumn('number', 'Min Salary');
    data1.addColumn('number', 'Max Salary');

    dataset.filter(d => d.cat === cat).slice(0, limit).forEach(d => {
        data1.addRow([d.name, d.min, d.max]);
    });

    const options1 = {
        title: `Salary Range: ${cat} (Top ${limit})`,
        colors: ['#4A90E2', '#0056b3'],
        legend: { position: 'top' },
        animation: { startup: true, duration: 500, easing: 'out' },
        chartArea: { width: '80%', height: '70%' },
        vAxis: { title: 'Salary (LPA)', minValue: 0 }
    };
    new google.visualization.ColumnChart(document.getElementById('bar_chart_div')).draw(data1, options1);


    // --- CHART 2: HORIZONTAL BAR (Duration vs Salary) ---
    const data2 = new google.visualization.DataTable();
    data2.addColumn('string', 'Course');
    data2.addColumn('number', 'Max Salary');

    dataset.filter(d => d.dur === dur).slice(0, limit).forEach(d => {
        data2.addRow([d.name, d.max]);
    });

    const options2 = {
        title: `Market Value: ${dur} Year Courses (Top ${limit})`,
        colors: ['#28a745'],
        legend: { position: 'none' },
        chartArea: { width: '50%', height: '80%' },
        hAxis: { title: 'Max Salary (LPA)', minValue: 0 }
    };
    new google.visualization.BarChart(document.getElementById('horiz_chart_div')).draw(data2, options2);


    // --- CHART 3: LINE CHART (Category vs Demand) ---
    const data3 = new google.visualization.DataTable();
    data3.addColumn('string', 'Course');
    data3.addColumn('number', 'Demand Index');

    dataset.filter(d => d.cat === cat).slice(0, limit).forEach(d => {
        data3.addRow([d.name, d.demand]);
    });

    const options3 = {
        title: `Demand Trend for ${cat} (Top ${limit})`,
        colors: ['#FF9900'],
        pointsVisible: true,
        curveType: 'function',
        legend: { position: 'bottom' },
        vAxis: { title: 'Demand (1-10)', minValue: 0, maxValue: 10 },
        chartArea: { width: '80%', height: '70%' }
    };
    new google.visualization.LineChart(document.getElementById('line_chart_div')).draw(data3, options3);
}

        window.onresize = drawCharts;
