<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Career Video</title>
<link rel="manifest" href="/manifest_7.json">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;

    }

    #video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: translate(-50%, -50%);
      z-index: -1;
    }

    #tap-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100px; /* Adjust size here */
      height: auto;
      transform: translate(-50%, -50%);
      z-index: 2;
      cursor: pointer;
    }
/* ADD THIS NEW CSS CLASS */


  </style>
</head>
<body>
<div style="position: absolute; bottom: 40px; width: 100%; text-align: center; z-index: 10;">
    <a href="mainnow.html" 
       style="
         /* Font and Text Styling */
         font-family: 'Impact', sans-serif;
         font-size: 1.5rem; /* 24px */
         color: #000000;
         text-decoration: none;
         letter-spacing: 1px;
         
         /* Button Shape and Color */
         background-color: aquamarine;
         padding: 15px 35px;
         border-radius: 10px;
         border: 1px solid #00c2a2; /* A slightly darker aquamarine for depth */
         
         /* The 3D Effect */
         box-shadow: 0 6px 0 #008f77, /* This is the dark "bottom edge" */
                     0 8px 15px rgba(0, 0, 0, 0.4); /* A subtle drop shadow */
         
         /* Smooth Transition for the click effect */
         transition: all 0.1s ease-in-out;
       "
       
       /* This changes the style when the button is being clicked */
       onmousedown="this.style.transform='translateY(4px)'; this.style.boxShadow='0 2px 0 #008f77';"
       onmouseup="this.style.transform='translateY(0)'; this.style.boxShadow='0 6px 0 #008f77, 0 8px 15px rgba(0, 0, 0, 0.4)';"
    >
        ENTER SITE
    </a>
</div>

  <!-- Tap Icon -->
  <img id="tap-icon" src="tap.png" alt="Tap to enable sound">

  <!-- Video element -->
  <video id="video" autoplay muted playsinline>
    <source src="cube.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>



  <script>
    const video = document.getElementById('video');
    const tapIcon = document.getElementById('tap-icon');

    tapIcon.addEventListener('click', function () {
      video.muted = false;
      video.play();
      tapIcon.style.display = 'none'; // Hide icon after tap
    });

    // Redirect to mainnow.html after video ends
    video.addEventListener('ended', function () {
      window.location.href = 'mainnow.html';
    });
  </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw-workbox.js')
        .then(registration => {
          console.log('Service Worker registered successfully:', registration);
        })
        .catch(error => {
          console.log('Service Worker registration failed:', error);
        });
    });
  }
</script>

</body>
</html>
