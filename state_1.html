            // === JAVASCRIPT LOGIC STARTS HERE (Place after the examData object) ===
            // ====================================================================================

           const examDropdown = document.getElementById('examDropdown');
            const searchByNameInput = document.getElementById('searchByName');
            const autocompleteList = document.getElementById('autocomplete-list');
            const detailsContainer = document.getElementById('examDetailsContainer');
            
            // Get elements for comparison feature
            const compareExam1 = document.getElementById('compareExam1');
            const compareExam2 = document.getElementById('compareExam2');
            const compareBtn = document.getElementById('compareBtn');

            // Create a reverse map for search functionality
            const examToStateMap = {};
            for (const state in stateGroups) {
                stateGroups[state].forEach(examKey => {
                    examToStateMap[examKey] = state;
                });
            }

            // 1. Populate All Dropdowns
            const stateNames = Object.keys(stateGroups).sort();
            const allExamKeys = Object.values(stateGroups).flat().filter((value, index, self) => self.indexOf(value) === index);
            const sortedExamKeys = allExamKeys.sort((a,b) => examData[a].name.localeCompare(examData[b].name));
            
            stateNames.forEach(stateName => {
                const option = document.createElement('option');
                option.value = stateName;
                option.textContent = stateName;
                examDropdown.appendChild(option);
            });

            sortedExamKeys.forEach(key => {
                const option1 = document.createElement('option');
                option1.value = key;
                option1.textContent = examData[key].name;
                const option2 = option1.cloneNode(true);
                compareExam1.appendChild(option1);
                compareExam2.appendChild(option2);
            });

            // 2. CORRECTED: Full 16-point display function
            function displayExamDetails(examKey) {
                const data = examData[examKey];
                if (!data) return '';

                const booksHtml = (data.books && data.books.length > 0) 
                    ? data.books.map(book => book.title).join('') 
                    : '<p>No specific book recommendations available.</p>';
                
                const hiringOrgsHtml = data.hiringOrgs 
                    ? data.hiringOrgs.map(org => `<li>${org}</li>`).join('') 
                    : '<li>Information not available.</li>';
                
                return `
                    <div class="exam-block">
                        <h2>${data.name}</h2>
                        <h2>1. Complete Syllabus Details</h2><pre>${data.syllabus.trim()}</pre>
                        <h2>2. Months of Exam Conduct</h2><p>${data.months}</p>
                        <h2>3. Eligibility for the Exam</h2><p>${data.eligibility}</p>
                        <h2>4. Age Limit</h2><p>${data.ageLimit}</p>
                        <h2>5. Facilities</h2><p>${data.facilities}</p>
                        <h2>6. Selection Process</h2><pre>${data.selectionProcess}</pre>
                        <h2>7. Exam Pattern</h2><pre>${data.examPattern}</pre>
                        <h2>8. Duration of the Exam</h2><p>${data.duration}</p>
                        <h2>9. Time of Results</h2><p>${data.resultsTime}</p>
                        <h2>10. Scope of Exam</h2><p>${data.scope}</p>
                        <h2>11. Starting Salary (Indicative)</h2><p>${data.startingSalary}</p>
                        <h2>12. Starting Post</h2><p>${data.startingPost}</p>
                        <h2>13. Fees for the Exams (Indicative)</h2><p>${data.fees}</p>
                        <h2>14. Top Potential Hiring Organisations</h2><ul>${hiringOrgsHtml}</ul>
                        <h2>15. Website</h2><p><a href="${data.website}" target="_blank">${data.website}</a></p>
                        <h2>16. Best Books for Preparation</h2>${booksHtml}
                    </div>
                `;
            }
            
            // 3. Master display function for state groups
            function displayStateGroupDetails(stateName) {
                compareExam1.value = '';
                compareExam2.value = '';
                const examKeys = stateGroups[stateName];
                if (!examKeys) {
                    detailsContainer.innerHTML = '<p>Please select a valid state.</p>';
                    return;
                }
                
                let combinedHtml = '';
                examKeys.forEach((key, index) => {
                    combinedHtml += displayExamDetails(key); // Re-use the full display function
                    if (index < examKeys.length - 1) {
                        combinedHtml += '<hr class="exam-separator">';
                    }
                });
                
                detailsContainer.innerHTML = combinedHtml;
            }

            // 4. Comparison display function
            function displayComparison(key1, key2) {
                examDropdown.value = '';
                searchByNameInput.value = '';
                const data1 = examData[key1];
                const data2 = examData[key2];

                const fields = [
                    { label: "Name of the Exam", key: "name" },
                    { label: "Eligibility", key: "eligibility" },
                    { label: "Age Limit", key: "ageLimit" },
                    { label: "Start Salary", key: "startingSalary" },
                    { label: "Starting Post", key: "startingPost" },
                    { label: "Fees", key: "fees" },
                    { label: "Facilities", key: "facilities" }
                ];

                let tableHtml = `
                    <h2 style="text-align:center;">Exam Comparison</h2>
                    <table class="comparison-table">
                        <thead>
                            <tr>
                                <th>Feature</th>
                                <th>${data1.name}</th>
                                <th>${data2.name}</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                fields.forEach(field => {
                    tableHtml += `
                        <tr>
                            <td>${field.label}</td>
                            <td>${data1[field.key]}</td>
                            <td>${data2[field.key]}</td>
                        </tr>
                    `;
                });

                tableHtml += `</tbody></table>`;
                detailsContainer.innerHTML = tableHtml;
            }

            // 5. Event Listeners
            examDropdown.addEventListener('change', function() {
                searchByNameInput.value = '';
                autocompleteList.innerHTML = '';
                if (this.value) {
                    displayStateGroupDetails(this.value);
                } else {
                    detailsContainer.innerHTML = '<p style="font-size: 1.2em; color: #555; text-align: center; margin-top: 50px;">Welcome! Please select a state from the left panel to see the details of its major exams.</p>';
                }
            });
            
            searchByNameInput.addEventListener('keyup', function() {
                const input = this.value.toLowerCase();
                autocompleteList.innerHTML = '';
                if (input.length < 2) return;

                const filteredKeys = sortedExamKeys.filter(key => 
                    examData[key] && examData[key].name.toLowerCase().includes(input)
                );

                filteredKeys.forEach(key => {
                    const item = document.createElement('div');
                    item.textContent = examData[key].name;
                    item.addEventListener('click', () => {
                        const stateName = examToStateMap[key];
                        searchByNameInput.value = examData[key].name;
                        autocompleteList.innerHTML = '';
                        examDropdown.value = stateName;
                        detailsContainer.innerHTML = displayExamDetails(key); // Show only the single selected exam
                    });
                    autocompleteList.appendChild(item);
                });
            });

            compareBtn.addEventListener('click', function() {
                const key1 = compareExam1.value;
                const key2 = compareExam2.value;
                if (!key1 || !key2) {
                    alert('Please select two exams to compare.');
                    return;
                }
                if (key1 === key2) {
                    alert('Please select two different exams for comparison.');
                    return;
                }
                displayComparison(key1, key2);
            });

            document.addEventListener('click', function(e) {
                if (e.target !== searchByNameInput) {
                    autocompleteList.innerHTML = '';
                }
            });
        });
    </script>
