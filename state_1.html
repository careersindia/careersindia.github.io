    syllabus: `
The APPSCCE is conducted in three stages, closely following the UPSC CSE pattern.

-----------------------------------------------------
STAGE I: PRELIMINARY EXAMINATION (OBJECTIVE TYPE)
-----------------------------------------------------
(This is a screening test. Marks are not counted for the final merit list.)

Paper I: General Studies (200 Marks, 2 Hours)
(Marks from this paper determine the cut-off for qualifying for the Main Exam.)
- Current events of national and international importance.
- History of India and Indian National Movement.
- Indian and World Geography - Physical, Social, Economic Geography of India and the World.
- Indian Polity and Governance - Constitution, Political System, Panchayati Raj, Public Policy, Rights Issues, etc.
- Economic and Social Development - Sustainable Development, Poverty, Inclusion, Demographics, Social Sector Initiatives, etc.
- General issues on Environmental ecology, Bio-diversity and Climate Change.
- General Science.
- **Special focus on Arunachal Pradesh:** History, Geography, Polity, Economy, and Culture of Arunachal Pradesh.

Paper II: General Aptitude Test (CSAT) (200 Marks, 2 Hours)
(This is a qualifying paper. You must score a minimum of 33% to pass.)
- Comprehension.
- Interpersonal skills including communication skills.
- Logical reasoning and analytical ability.
- Decision making and problem solving.
- General mental ability.
- Basic numeracy (numbers and their relations, orders of magnitude, etc.) (Class X level).
- Data interpretation (charts, graphs, tables, data sufficiency etc.) (Class X level).

-------------------------------------------------
STAGE II: MAIN EXAMINATION (DESCRIPTIVE TYPE)
-------------------------------------------------
(Total Marks: 2000. Marks are counted for the final merit list.)

Paper I: Essay (250 Marks)
- Candidates will be required to write essays on a variety of topics, often related to current affairs, social issues, or philosophical themes, with a possible focus on Arunachal Pradesh.

Paper II: General Studies - I (250 Marks)
- Indian Heritage and Culture, History and Geography of the World and Society.
- Special focus on the History, Culture, and Geography of Arunachal Pradesh, including its tribes, traditions, and historical significance.

Paper III: General Studies - II (250 Marks)
- Governance, Constitution, Polity, Social Justice and International Relations.
- Special focus on the administrative structure, political system, and social welfare schemes of Arunachal Pradesh.

Paper IV: General Studies - III (250 Marks)
- Technology, Economic Development, Bio-diversity, Environment, Security and Disaster Management.
- Special focus on the economy, environment, and specific security challenges of Arunachal Pradesh.

Paper V: General Studies - IV (250 Marks)
- Ethics, Integrity, and Aptitude. (Standard UPSC pattern)

Paper VI: General Studies - V (250 Marks)
- This is a dedicated paper on Arunachal Pradesh.
- History, Geography, Polity, Economy, Environment, and Social Issues of Arunachal Pradesh in detail.

Paper VII & VIII: Optional Subject (Paper 1 & Paper 2) (250 Marks Each)
- Candidates have to choose one optional subject from a list provided by the APPSC. The syllabus for the optional subject is typically of the honours degree level.

-------------------------------------------------
STAGE III: INTERVIEW / VIVA-VOCE (275 MARKS)
-------------------------------------------------
- The final stage to assess the candidate's personality, mental alertness, and suitability for a career in public service.

- Literature, Music, Dance, Art and Culture, Janula, Muhaware, Hana and Lokoktiyan of Chhattisgarh.
- Tribes, Special Traditions, Teej and Festivals of Chhattisgarh.
- Economy, Forest and Agriculture of Chhattisgarh.
- Administrative Structure, Local Government and Panchayati Raj of Chhattisgarh.
- Industry, Energy, Water and Mineral Resources of Chhattisgarh.
- Current Affairs of Chhattisgarh.

- Interpersonal skills including communication skills.

- General mental ability.

- Knowledge of Hindi Language (Class X level).
- Knowledge of Chhattisgarhi Language.

-------------------------------------------------

Paper I: Language (200 Marks, 3 Hours)

Paper II: Essay (200 Marks, 3 Hours)

Paper III: General Studies - I (200 Marks, 3 Hours)
- History of India, Polity, Public Administration, and History of Chhattisgarh.

Paper IV: General Studies - II (200 Marks, 3 Hours)
- General Science, Chemistry, Physics, Biology, and Applied Sciences.

Paper V: General Studies - III (200 Marks, 3 Hours)
- Economy of India & Chhattisgarh, Geography of India & Chhattisgarh.

Paper VI: General Studies - IV (200 Marks, 3 Hours)
- Philosophy and Sociology.

Paper VII: General Studies - V (200 Marks, 3 Hours)
- Welfare, Development Programmes & Laws, Human Resource Development, and related topics.

-------------------------------------------------
STAGE III: INTERVIEW / PERSONALITY TEST (100 MARKS)
-------------------------------------------------
- The final stage to assess the candidate's personality, suitability, and awareness.

    syllabus: `

-----------------------------------------------------

- Paper II: CSAT (200 Marks, Qualifying)

-------------------------------------------------
STAGE III: INTERVIEW / PERSONALITY TEST (275 MARKS)
-------------------------------------------------

            const examDropdown = document.getElementById('examDropdown');

            const examToStateMap = {};

            // 2. Individual Exam Display Function (returns HTML instead of setting it)
            function getExamDetailsHTML(examKey) {
                const data = examData[examKey];
                if (!data) return ''; // Return empty string if data is missing

                const booksHtml = (data.books && data.books.length > 0) 
                    ? data.books.map(book => book.title).join('') 
                    : '<p>No specific book recommendations available.</p>';
                
                const hiringOrgsHtml = data.hiringOrgs 
                    ? data.hiringOrgs.map(org => `<li>${org}</li>`).join('') 
                    : '<li>Information not available.</li>';

                return `
                    <div class="exam-block">
                        <h2>${data.name}</h2>
                        <h2>1. Complete Syllabus Details</h2><pre>${data.syllabus.trim()}</pre>
                        <h2>2. Months of Exam Conduct</h2><p>${data.months}</p>
                        <h2>3. Eligibility for the Exam</h2><p>${data.eligibility}</p>
                        <h2>4. Age Limit</h2><p>${data.ageLimit}</p>
                        <h2>5. Facilities</h2><p>${data.facilities}</p>
                        <h2>6. Selection Process</h2><pre>${data.selectionProcess}</pre>
                        <h2>7. Exam Pattern</h2><pre>${data.examPattern}</pre>

                        <h2>14. Top Potential Hiring Organisations</h2><ul>${hiringOrgsHtml}</ul>
                        <h2>15. Website</h2><p><a href="${data.website}" target="_blank">${data.website}</a></p>
                        <h2>16. Best Books for Preparation</h2>${booksHtml}
                    </div>
                `;
            }
            
            // --- NEW: Master Display Function for State Groups ---
            function displayStateGroupDetails(stateName) {
                const examKeys = stateGroups[stateName];
                if (!examKeys) {
                    detailsContainer.innerHTML = '<p>Please select a valid state.</p>';
                    return;
                }
                
                let combinedHtml = '';
                examKeys.forEach((key, index) => {
                    combinedHtml += getExamDetailsHTML(key);
                    if (index < examKeys.length - 1) {
                        combinedHtml += '<hr class="exam-separator">';
                    }
                });
                
                detailsContainer.innerHTML = combinedHtml;
            }

            // 3. Updated Event Listeners
            examDropdown.addEventListener('change', function() {
                searchByNameInput.value = '';
                autocompleteList.innerHTML = '';
                if (this.value) {
                    displayStateGroupDetails(this.value);
                } else {
                    detailsContainer.innerHTML = '<p>Please select a state from the left panel to see the details.</p>';
                }
            });
            
            searchByNameInput.addEventListener('keyup', function() {
                const input = this.value.toLowerCase();
                autocompleteList.innerHTML = '';
                if (input.length < 2) return;

                const allExamKeys = Object.keys(examData);
                const filteredKeys = allExamKeys.filter(key => 
                    examData[key].name.toLowerCase().includes(input)
                );

                filteredKeys.forEach(key => {
                    const item = document.createElement('div');
                    item.textContent = examData[key].name;
                    item.addEventListener('click', () => {
                        const stateName = examToStateMap[key]; // Find the parent state
                        searchByNameInput.value = examData[key].name; // Show selected exam
                        autocompleteList.innerHTML = '';
                        examDropdown.value = stateName; // Sync dropdown
                        displayStateGroupDetails(stateName); // Display the whole group
                    });
                    autocompleteList.appendChild(item);
                });
            });

            document.addEventListener('click', function(e) {
                if (e.target !== searchByNameInput) {
                    autocompleteList.innerHTML = '';
                }
            });
        });
    </script>
